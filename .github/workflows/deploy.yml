name: 🚀 Deploy Vite + FTPS (Self-Hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref da deployare (branch, tag o SHA)'
        required: false
        default: main

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 📤 Build Vite e deploy FTPS
    runs-on: self-hosted
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dipendenze frontend
        run: npm ci
        working-directory: ./frontend

      - name: 🏗️ Build statico Vite
        run: npm run build
        working-directory: ./frontend

      - name: 📤 Deploy frontend statico su FTP_DIR
        uses: SamKirkland/FTP-Deploy-Action@v4.4.1
        with:
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          host: ${{ secrets.FTP_HOST }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.FTP_DIR }}
          secure: ${{ secrets.FTP_SSL != 'false' }}
          exclude: |
            *.html.map
            *.css.map
            *.js.map

      - name: 📤 Deploy backend API su FTP_DIR/api (escluso .env)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.1
        with:
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          host: ${{ secrets.FTP_HOST }}
          local-dir: ./api/
          server-dir: ${{ secrets.FTP_DIR }}/api
          secure: ${{ secrets.FTP_SSL != 'false' }}
          exclude: |
            .env
            .env.local
            install.php
            vendor/
